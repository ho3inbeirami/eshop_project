{% extends "base.html" %}

{% block title %} product list {% endblock  %}


{% block content %}
    <ul>
        
        {% for product in products_list %}
            <li>
                {% comment %} <a href="{% url "product_detail_page" id=product.id %}"> {{product.title}} / {{product.price}}</a> {% endcomment %}
                <a href="{{product.get_absolute_url}}"> {{product.title}} / {{product.price}}</a>
            </li>
        {% endfor %}
    </ul>

{% endblock  %}
