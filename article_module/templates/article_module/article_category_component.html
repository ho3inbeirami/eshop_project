<div class="panel-group category-products" id="accordian"><!--category-productsr-->
    
    {% for main_cat in main_categories %}
        <div class="panel panel-default">
            <div class="panel-heading">
                <h4 class="panel-title">

                    <a data-toggle="collapse" data-parent="#accordian" href="#{{main_cat.url_title}}">
                        <span class="badge pull-right"><i class="fa fa-plus"></i></span> {{main_cat.title}}</a>
                </h4>
            </div>
            <div id="{{main_cat.url_title}}" class="panel-collapse collapse">
                <div class="panel-body">
                    <ul>
                        
                        {% for sub_cat in main_cat.sub_categories.all %}
                            <li><a href="{{sub_cat.url_title}}">{{sub_cat}}</a></li>
                        {% endfor %}
                            

                    </ul>
                </div>
            </div>
        </div>
    {% endfor %}


</div><!--/category-productsr-->
