{% extends 'shared/_layot.html' %}


{% block  title %}
    login
{% endblock  %}
    




{% block content %}
    <div class="container">
		<section id="form"><!--form-->
			<div class="row">

				<div class="col-sm-6 col-md-offset-3">
					<div class="signup-form"><!--sign up form-->
						<h2>ورود به حساب کاربری</h2>
						<form action="#" method="post">
                            {% csrf_token %}
                            {{form.email}}
							<div class='form_alert'>
                                {{form.email.errors}}
							</div>
                            {{form.password}}
							<div class='form_alert'>
                                {{form.password.errors}}
							</div>
							<button type="submit" class="btn btn-default">ورود</button>
						</form>
						<p> <a href="{% url 'forget_password_page' %}" > فراموشی رمز عبور </a> </p>
						<p> <a href="{% url 'register_page' %}" > عضویت</a> </p>
					</div><!--/sign up form-->
				</div>
			</div>
		</section>
	</div>
{% endblock  %}
